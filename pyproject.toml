[project]
name = "agent-smith"
version = "0.1.0"
description = "AI agent that generates and executes code. The agent uses an MCP server to determine available resources."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "docker>=7.2.0",
    "fire>=0.7.1",
    "google-genai>=2.22.0",
    "mcp>=2.2.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "types-requests>=2.33.0.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/sandbox",
    "src/agent_mbpp",
    "src/agent_swebench"
]
